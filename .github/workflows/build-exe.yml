name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Tag for a draft release, e.g. v4.0.0 (leave empty to just build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build exe
        run: pyinstaller --noconfirm tpautoclicker.spec

      - name: Self-test the exe
        shell: pwsh
        run: |
          $size = (Get-Item dist\TPAutoClicker.exe).Length / 1MB
          "exe size: {0:N1} MB" -f $size | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $t = Start-Process dist\TPAutoClicker.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "self-test failed with exit code $($t.ExitCode)" }
          $p = Start-Process dist\TPAutoClicker.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path dist\templates\retry.png)) { throw "bundled templates were not installed" }
          if (-not (Test-Path dist\sequences\tower_defense_retry_loop.json)) { throw "bundled sequence was not installed" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\TPAutoClicker.exe release\
          Copy-Item README.md release\
          Compress-Archive -Path release\* -DestinationPath TPAutoClicker-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: TPAutoClicker-windows
          path: release/TPAutoClicker.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TPAutoClicker-windows.zip
            release/TPAutoClicker.exe

      # Run the workflow by hand with a tag to get a draft release to review.
      # Nothing is public and no tag is created until the draft is published.
      - name: Draft release (manual runs with a tag)
        if: github.event_name == 'workflow_dispatch' && inputs.draft_release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.draft_release }}
          target_commitish: ${{ github.sha }}
          name: TP Auto Clicker ${{ inputs.draft_release }}
          body_path: release-notes/${{ inputs.draft_release }}.md
          draft: true
          files: |
            TPAutoClicker-windows.zip
            release/TPAutoClicker.exe
