name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Tag for a draft release, e.g. v4.0.0 (leave empty to just build)"
        required: false
        default: ""

# Read-only by default. Only the release job below gets a write token, and it
# never runs for pull requests.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest -c constraints-ci.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build exe
        run: pyinstaller --noconfirm tpautoclicker.spec

      - name: Self-test the exe
        shell: pwsh
        run: |
          $size = (Get-Item dist\TPAutoClicker.exe).Length / 1MB
          "exe size: {0:N1} MB" -f $size | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          $t = Start-Process dist\TPAutoClicker.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "self-test failed with exit code $($t.ExitCode)" }
          $p = Start-Process dist\TPAutoClicker.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path dist\templates\retry.png)) { throw "bundled templates were not installed" }
          if (-not (Test-Path dist\sequences\tower_defense_retry_loop.json)) { throw "bundled sequence was not installed" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\TPAutoClicker.exe release\
          Copy-Item README.md release\
          Compress-Archive -Path release\* -DestinationPath TPAutoClicker-windows.zip -Force

      - name: Checksums
        shell: pwsh
        run: |
          $lines = foreach ($f in "release\TPAutoClicker.exe", "TPAutoClicker-windows.zip") {
            "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), (Split-Path $f -Leaf)
          }
          # LF line endings so "sha256sum -c" on Linux/macOS can read it too
          [IO.File]::WriteAllText("$PWD\SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          Get-Content SHA256SUMS.txt | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TPAutoClicker-windows
          path: |
            release/TPAutoClicker.exe
            TPAutoClicker-windows.zip
            SHA256SUMS.txt

  # Publishing is a separate job so the write token never sits next to the
  # dependency install, the tests or the build.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.draft_release != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: release-notes

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TPAutoClicker-windows
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: |
          cp release/TPAutoClicker.exe .
          sha256sum -c SHA256SUMS.txt

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/TPAutoClicker-windows.zip
            dist/TPAutoClicker.exe
            dist/SHA256SUMS.txt

      # Run the workflow by hand with a tag to get a draft release to review.
      # Nothing is public and no tag is created until the draft is published.
      - name: Draft release (manual runs with a tag)
        if: github.event_name == 'workflow_dispatch' && inputs.draft_release != ''
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.draft_release }}
          target_commitish: ${{ github.sha }}
          name: TP Auto Clicker ${{ inputs.draft_release }}
          body_path: release-notes/${{ inputs.draft_release }}.md
          draft: true
          files: |
            dist/TPAutoClicker-windows.zip
            dist/TPAutoClicker.exe
            dist/SHA256SUMS.txt
